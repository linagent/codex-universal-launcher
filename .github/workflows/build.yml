name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Run offline self-tests
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'bin\Release\net8.0-windows\CodexUniversalLauncher.exe'
          $result = Join-Path $PWD 'self-test.txt'
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test','--result',$result -Wait -PassThru
          if (Test-Path -LiteralPath $result) { Get-Content -LiteralPath $result }
          if ($process.ExitCode -ne 0) { throw "Self-tests failed with exit code $($process.ExitCode)" }

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Publish x64 smoke artifact
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/win-x64

      - name: Upload smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexUniversalLauncher-win-x64
          path: publish/win-x64/CodexUniversalLauncher.exe
